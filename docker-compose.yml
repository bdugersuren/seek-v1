# seek.mn Platform Core and Service Orchestration
# All containers must connect to the external 'shared-net'.

services:
  # =========================================================================
  # Core Infrastructure Services (Profile-less)
  # =========================================================================
  postgres:
    image: seek-postgres:latest
    build:
      context: .
      dockerfile: services/postgres/Dockerfile
    container_name: seek-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-seek_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-seek_postgres_pass}
      POSTGRES_DB: ${POSTGRES_DB:-seek_core_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh
    networks:
      shared-net:
        aliases:
          - auth-postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 15

  redis:
    image: seek-redis:latest
    build:
      context: .
      dockerfile: services/redis/Dockerfile
    container_name: seek-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-seek_redis_pass}
    volumes:
      - redis_data:/data
    networks:
      - shared-net

  rabbitmq:
    image: seek-rabbitmq:latest
    build:
      context: .
      dockerfile: services/rabbitmq/Dockerfile
    container_name: seek-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-seek_mq_user}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-seek_rabbitmq_pass}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - shared-net

  minio:
    image: seek-minio:latest
    build:
      context: .
      dockerfile: services/minio/Dockerfile
    container_name: seek-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-seek_minio_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-seek_minio_pass}
    volumes:
      - minio_data:/data
    networks:
      - shared-net

  # =========================================================================
  # Core Business Services (Profile-less)
  # =========================================================================
  auth-migrate:
    profiles:
      - auth-test
    build:
      context: .
      dockerfile: services/auth/Dockerfile
    container_name: seek-auth-migrate
    working_dir: /app/services/auth
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-seek_admin}:${POSTGRES_PASSWORD:-seek_postgres_pass}@auth-postgres:5432/auth_db
    entrypoint: ["npx", "prisma", "migrate", "deploy"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - shared-net

  auth-seed:
    profiles:
      - auth-test
    build:
      context: .
      dockerfile: services/auth/Dockerfile
    container_name: seek-auth-seed
    working_dir: /app/services/auth
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-seek_admin}:${POSTGRES_PASSWORD:-seek_postgres_pass}@auth-postgres:5432/auth_db
      NODE_ENV: development
    entrypoint: ["npx", "ts-node", "prisma/seed.ts"]
    depends_on:
      auth-migrate:
        condition: service_completed_successfully
    networks:
      - shared-net

  auth:
    profiles:
      - auth-test
    image: seek-auth:latest
    build:
      context: .
      dockerfile: services/auth/Dockerfile
    container_name: seek-auth
    expose:
      - "3020"
    ports:
      - "127.0.0.1:3020:3020"
    environment:
      PORT: 3020
      NODE_ENV: development
      DATABASE_URL: postgresql://${POSTGRES_USER:-seek_admin}:${POSTGRES_PASSWORD:-seek_postgres_pass}@auth-postgres:5432/auth_db
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-seek_jwt_secret_key_placeholder}
      AUTH_TOKEN_ISSUER: ${AUTH_TOKEN_ISSUER:-seek.mn}
      AUTH_TOKEN_AUDIENCE: ${AUTH_TOKEN_AUDIENCE:-seek.mn}
    networks:
      - shared-net
    depends_on:
      postgres:
        condition: service_healthy
      auth-seed:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e ''require("http").get("http://localhost:3020/health", (r) => process.exit(r.statusCode === 200 ? 0 : 1))''',
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  gateway:
    profiles:
      - auth-test
    image: seek-gateway:latest
    build:
      context: .
      dockerfile: services/gateway/Dockerfile
    container_name: seek-gateway
    expose:
      - "3010"
    ports:
      - "127.0.0.1:3010:3010"
    environment:
      PORT: 3010
      NODE_ENV: development
      AUTH_SERVICE_URL: http://auth:3020
      EXECUTION_SERVICE_URL: http://execution:3090
      AUTH_ALLOWED_ORIGINS: http://localhost:8081,http://localhost:8082,http://127.0.0.1:8081,http://127.0.0.1:8082,http://portal.seek.mn,http://quiz.seek.mn,http://quiz-api.seek.mn
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-seek_jwt_secret_key_placeholder}
      AUTH_TOKEN_ISSUER: ${AUTH_TOKEN_ISSUER:-seek.mn}
      AUTH_TOKEN_AUDIENCE: ${AUTH_TOKEN_AUDIENCE:-seek.mn}
    networks:
      - shared-net
    depends_on:
      auth:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e ''require("http").get("http://localhost:3010/health", (r) => process.exit(r.statusCode === 200 ? 0 : 1))''',
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  # =========================================================================
  # Frontend Application Services (frontend profile)
  # =========================================================================
  portal-web:
    profiles:
      - frontend
      - auth-test
    image: seek-portal-web:latest
    build:
      context: .
      dockerfile: apps/portal-web/Dockerfile
    container_name: seek-portal-web
    working_dir: /app/apps/portal-web
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/portal-web/node_modules
      - /app/apps/portal-web/.next
    ports:
      - "127.0.0.1:8081:8081"
    environment:
      - NODE_ENV=development
      - INTERNAL_API_URL=http://gateway:3010/api
      - NEXT_PUBLIC_API_URL=http://quiz-api.seek.mn/api
    command: sh -c "npm install -g pnpm && cd /app && CI=true pnpm install --frozen-lockfile && pnpm --filter @seek/portal-web dev"
    networks:
      - shared-net
    depends_on:
      gateway:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e ''require("http").get("http://localhost:8081", (r) => process.exit(r.statusCode === 200 || r.statusCode === 307 ? 0 : 1))''',
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  assessment-web:
    profiles:
      - frontend
      - assessment
    image: seek-assessment-web:latest
    build:
      context: .
      dockerfile: apps/assessment-web/Dockerfile
    container_name: seek-assessment-web
    working_dir: /app/apps/assessment-web
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/assessment-web/node_modules
      - /app/apps/assessment-web/.next
    ports:
      - "127.0.0.1:8082:8082"
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=http://quiz-api.seek.mn/api
      - NEXT_PUBLIC_EXECUTION_URL=http://quiz-api.seek.mn/api/v1/execution
      - NEXT_PUBLIC_MOCK_MODE=false
    command: sh -c "npm install -g pnpm && cd /app && CI=true pnpm install --frozen-lockfile && pnpm --filter @seek/assessment-web dev"
    depends_on:
      - execution
    networks:
      - shared-net

  # =========================================================================
  # Assessment & Evaluation Services (assessment profile)
  # =========================================================================
  profile:
    profiles:
      - assessment
    image: seek-profile:latest
    build:
      context: .
      dockerfile: services/profile/Dockerfile
    container_name: seek-profile
    expose:
      - "3030"
    environment:
      PORT: 3030
    networks:
      - shared-net

  organisation:
    profiles:
      - assessment
    image: seek-organisation:latest
    build:
      context: .
      dockerfile: services/organisation/Dockerfile
    container_name: seek-organisation
    expose:
      - "3040"
    environment:
      PORT: 3040
    networks:
      - shared-net

  verification:
    profiles:
      - assessment
    image: seek-verification:latest
    build:
      context: .
      dockerfile: services/verification/Dockerfile
    container_name: seek-verification
    expose:
      - "3050"
    environment:
      PORT: 3050
    networks:
      - shared-net

  competency:
    profiles:
      - assessment
    image: seek-competency:latest
    build:
      context: .
      dockerfile: services/competency/Dockerfile
    container_name: seek-competency
    expose:
      - "3060"
    environment:
      PORT: 3060
    networks:
      - shared-net

  assessment:
    profiles:
      - assessment
    image: seek-assessment:latest
    build:
      context: .
      dockerfile: services/assessment/Dockerfile
    container_name: seek-assessment
    expose:
      - "3070"
    environment:
      PORT: 3070
    networks:
      - shared-net

  commerce:
    profiles:
      - assessment
    image: seek-commerce:latest
    build:
      context: .
      dockerfile: services/commerce/Dockerfile
    container_name: seek-commerce
    expose:
      - "3080"
    environment:
      PORT: 3080
    networks:
      - shared-net

  execution:
    profiles:
      - assessment
    image: seek-execution:latest
    build:
      context: .
      dockerfile: services/execution/Dockerfile
    container_name: seek-execution
    expose:
      - "3090"
    environment:
      PORT: 3090
      USE_REDIS: "true"
      USE_RABBITMQ: "true"
      REDIS_URL: redis://:seek_redis_pass@redis:6379
      RABBITMQ_URL: amqp://seek_mq_user:seek_rabbitmq_pass@rabbitmq:5672
    networks:
      - shared-net

  evaluation-worker:
    profiles:
      - assessment
    image: seek-evaluation-worker:latest
    build:
      context: .
      dockerfile: services/evaluation/Dockerfile
    container_name: seek-evaluation-worker
    expose:
      - "3100"
    environment:
      PORT: 3100
    networks:
      - shared-net

  learning:
    profiles:
      - assessment
    image: seek-learning:latest
    build:
      context: .
      dockerfile: services/learning/Dockerfile
    container_name: seek-learning
    expose:
      - "3110"
    environment:
      PORT: 3110
    networks:
      - shared-net

  reporting:
    profiles:
      - assessment
    image: seek-reporting:latest
    build:
      context: .
      dockerfile: services/reporting/Dockerfile
    container_name: seek-reporting
    expose:
      - "3150"
    environment:
      PORT: 3150
    networks:
      - shared-net

  file:
    profiles:
      - assessment
    image: seek-file:latest
    build:
      context: .
      dockerfile: services/file/Dockerfile
    container_name: seek-file
    expose:
      - "3140"
    environment:
      PORT: 3140
    networks:
      - shared-net

  platform:
    profiles:
      - assessment
    image: seek-platform:latest
    build:
      context: .
      dockerfile: services/platform/Dockerfile
    container_name: seek-platform
    expose:
      - "3160"
    environment:
      PORT: 3160
    networks:
      - shared-net

  # =========================================================================
  # AI Orchestration Services (ai profile)
  # =========================================================================
  ollama:
    profiles:
      - ai
    image: ollama/ollama:latest
    container_name: seek-ollama
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - shared-net

  qdrant:
    profiles:
      - ai
    image: qdrant/qdrant:latest
    container_name: seek-qdrant
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - shared-net

  ai:
    profiles:
      - ai
    image: seek-ai:latest
    build:
      context: .
      dockerfile: services/ai/Dockerfile
    container_name: seek-ai
    expose:
      - "3120"
    environment:
      PORT: 3120
    networks:
      - shared-net

  # =========================================================================
  # Integration Services (integration profile)
  # =========================================================================
  integration:
    profiles:
      - integration
    image: seek-integration:latest
    build:
      context: .
      dockerfile: services/integration/Dockerfile
    container_name: seek-integration
    expose:
      - "3130"
    environment:
      PORT: 3130
    networks:
      - shared-net

  nginx-proxy:
    image: seek-npm:latest
    build:
      context: .
      dockerfile: services/npm/Dockerfile
    container_name: seek-npm
    restart: unless-stopped
    ports:
      - '80:80'
      - '81:81'
      - '443:443'
    volumes:
      - ./docker/nginx-proxy/data:/data
      - ./docker/nginx-proxy/letsencrypt:/etc/letsencrypt
    networks:
      - shared-net

# =========================================================================
# Shared Network Configuration
# =========================================================================
networks:
  shared-net:
    external: true
    name: shared-net

# =========================================================================
# Volume Definitions
# =========================================================================
volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  minio_data:
  ollama_data:
  qdrant_data:
