      DATABASE_URL: postgresql://${POSTGRES_USER:-seek_admin}:${POSTGRES_PASSWORD:-seek_postgres_pass}@postgres:5432/file_db?connection_limit=5
      MINIO_ENDPOINT: http://minio:9000
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-https://files.seek.mn}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-seek_minio_admin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-seek_minio_pass}
      MINIO_BUCKET: seek-files
      NODE_TLS_REJECT_UNAUTHORIZED: "0"
    networks:
      - shared-net
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started

