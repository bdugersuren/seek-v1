  auth:
    image: seek-auth:latest
    build:
      context: .
      dockerfile: services/auth/Dockerfile
    container_name: seek-auth
    restart: unless-stopped
    expose:
      - "3020"
    ports:
      - "127.0.0.1:3020:3020"
    environment:
      PORT: 3020
      NODE_ENV: development
      DATABASE_URL: postgresql://${POSTGRES_USER:-seek_admin}:${POSTGRES_PASSWORD:-seek_postgres_pass}@auth-postgres:5432/auth_db
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-seek_jwt_key_safe_entropy_1234567890_super_secure}
      AUTH_TOKEN_ISSUER: ${AUTH_TOKEN_ISSUER:-seek.mn}
      AUTH_TOKEN_AUDIENCE: ${AUTH_TOKEN_AUDIENCE:-seek.mn}
      AUTH_PUBLIC_APP_URL: ${AUTH_PUBLIC_APP_URL:-http://localhost:3001}
      AUTH_EMAIL_FROM: ${AUTH_EMAIL_FROM:-no-reply@seek.mn}
      AUTH_EMAIL_VERIFICATION_TTL_HOURS: ${AUTH_EMAIL_VERIFICATION_TTL_HOURS:-24}
      AUTH_EMAIL_DELIVERY_MODE: ${AUTH_EMAIL_DELIVERY_MODE:-log}
      AUTH_RATE_LIMIT_MAX: ${AUTH_RATE_LIMIT_MAX:-1000}
      AUTH_RATE_LIMIT_WINDOW_MS: ${AUTH_RATE_LIMIT_WINDOW_MS:-60000}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_HELO_DOMAIN: ${SMTP_HELO_DOMAIN:-seek.mn}
      RUN_SEED: "true"
      TS_NODE_COMPILER_OPTIONS: '{"module":"CommonJS"}'
    networks:
      - shared-net
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e ''require("http").get("http://localhost:3020/health", (r) => process.exit(r.statusCode === 200 ? 0 : 1))''',
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  gateway:
    image: seek-gateway:latest
    build:
      context: .
      dockerfile: services/gateway/Dockerfile
    container_name: seek-gateway
    restart: unless-stopped
    expose:
      - "3010"
    ports:
      - "127.0.0.1:3010:3010"
    environment:
      PORT: 3010
      NODE_ENV: development
      AUTH_SERVICE_URL: http://auth:3020
      PROFILE_SERVICE_URL: http://profile:3030
      ORGANISATION_SERVICE_URL: http://organisation:3040
      ASSESSMENT_SERVICE_URL: http://assessment:3070
      EXECUTION_SERVICE_URL: http://execution:3090
      COMMERCE_SERVICE_URL: http://commerce:3080
      FILE_SERVICE_URL: http://file:3140
      NOTIFICATION_SERVICE_URL: http://notification:3170
      REPORTING_SERVICE_URL: http://reporting:3150
      AUTH_ALLOWED_ORIGINS: http://localhost:8081,http://localhost:8082,http://127.0.0.1:8081,http://127.0.0.1:8082,http://portal.seek.mn,http://quiz.seek.mn,http://quiz-api.seek.mn,https://portal.seek.mn,https://quiz.seek.mn,https://quiz-api.seek.mn
      AUTH_CSRF_ALLOW_MISSING_ORIGIN: ${AUTH_CSRF_ALLOW_MISSING_ORIGIN:-false}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-seek_jwt_key_safe_entropy_1234567890_super_secure}
      AUTH_TOKEN_ISSUER: ${AUTH_TOKEN_ISSUER:-seek.mn}
      AUTH_TOKEN_AUDIENCE: ${AUTH_TOKEN_AUDIENCE:-seek.mn}
    networks:
      - shared-net
    depends_on:
      auth:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e ''require("http").get("http://localhost:3010/health", (r) => process.exit(r.statusCode === 200 ? 0 : 1))''',
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  # =========================================================================
  # Frontend Application Services (frontend profile)
  # =========================================================================
  portal-web:
    image: seek-portal-web:latest
    build:
      context: .
      dockerfile: apps/portal-web/Dockerfile
    container_name: seek-portal-web
    restart: unless-stopped
    working_dir: /app/apps/portal-web
    volumes:
      - .:/app
      - /app/apps/portal-web/.next
    ports:
      - "127.0.0.1:8081:8081"
    environment:
      - NODE_ENV=development
      - INTERNAL_API_URL=${INTERNAL_API_URL:-http://gateway:3010/api}
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-https://quiz-api.seek.mn/api}
      - NEXT_PUBLIC_ENABLE_MOCK_AUTH=false
    command: pnpm --filter @seek/portal-web dev
    networks:
      - shared-net
    depends_on:
      node-modules-init:
        condition: service_completed_successfully
      gateway:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e ''require("http").get("http://localhost:8081", (r) => process.exit(r.statusCode === 200 || r.statusCode === 307 ? 0 : 1))''',
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  assessment-web:
    image: seek-assessment-web:latest
    build:
      context: .
      dockerfile: apps/assessment-web/Dockerfile
    container_name: seek-assessment-web
    restart: unless-stopped
    working_dir: /app/apps/assessment-web
    volumes:
      - .:/app
      - /app/apps/assessment-web/.next
    ports:
      - "127.0.0.1:8082:8082"
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-https://quiz-api.seek.mn/api}
      - NEXT_PUBLIC_EXECUTION_URL=${NEXT_PUBLIC_EXECUTION_URL:-https://quiz-api.seek.mn/api/v1/execution}
      - NEXT_PUBLIC_MOCK_MODE=false
    command: pnpm --filter @seek/assessment-web dev
    depends_on:
      node-modules-init:
        condition: service_completed_successfully
      execution:
        condition: service_started
    networks:
      - shared-net

  # =========================================================================
  # Assessment & Evaluation Services (assessment profile)
  # =========================================================================
  profile:
    image: seek-profile:latest
    build:
      context: .
      dockerfile: services/profile/Dockerfile
    container_name: seek-profile
    restart: unless-stopped
    expose:
      - "3030"
    environment:
      PORT: 3030
      DATABASE_URL: postgresql://${POSTGRES_USER:-seek_admin}:${POSTGRES_PASSWORD:-seek_postgres_pass}@postgres:5432/profile_db?connection_limit=5
      FILE_SERVICE_URL: http://file:3140
      INTEGRATION_SERVICE_URL: http://integration:3130
    networks:
      - shared-net
    depends_on:
      postgres:
        condition: service_healthy
      integration:
        condition: service_healthy

  organisation:
    image: seek-organisation:latest
    build:
      context: .
      dockerfile: services/organisation/Dockerfile
    container_name: seek-organisation
    restart: unless-stopped
    expose:
      - "3040"
    environment:
      PORT: 3040
      DATABASE_URL: postgresql://${POSTGRES_USER:-seek_admin}:${POSTGRES_PASSWORD:-seek_postgres_pass}@postgres:5432/organisation_db?connection_limit=5
    networks:
      - shared-net
    depends_on:
      postgres:
        condition: service_healthy

