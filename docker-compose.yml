  integration:
    image: seek-integration:latest
    build:
      context: .
      dockerfile: services/integration/Dockerfile
    container_name: seek-integration
    restart: unless-stopped
    expose:
      - "3130"
    environment:
      PORT: 3130
      NODE_ENV: ${NODE_ENV:-development}
    networks:
      - shared-net
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e ''require("http").get("http://localhost:3130/health/ready", (r) => process.exit(r.statusCode === 200 ? 0 : 1))''',
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  nginx-proxy:
    image: seek-npm:latest
    build:
      context: .
      dockerfile: services/npm/Dockerfile
    container_name: seek-npm
    restart: unless-stopped
    ports:
      - '80:80'
      - '81:81'
      - '443:443'
    volumes:
      - ./docker/nginx-proxy/data:/data
      - ./docker/nginx-proxy/letsencrypt:/etc/letsencrypt
    networks:
      shared-net:
        aliases:
          - portal.seek.mn
          - files.seek.mn
          - minio-console.seek.mn

# =========================================================================
# Shared Network Configuration
# =========================================================================
networks:
  shared-net:
    external: true
    name: shared-net

# =========================================================================
# Volume Definitions
# =========================================================================
volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  minio_data:
