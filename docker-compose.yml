  execution:
    image: seek-execution:latest
    build:
      context: .
      dockerfile: services/execution/Dockerfile
    container_name: seek-execution
    restart: unless-stopped
    expose:
      - "3090"
    environment:
      PORT: 3090
      USE_REDIS: "true"
      USE_RABBITMQ: "true"
      ENABLE_SIGNATURE_VERIFICATION: "false"
      EXECUTION_DATABASE_URL: postgresql://${POSTGRES_USER:-seek_admin}:${POSTGRES_PASSWORD:-seek_postgres_pass}@postgres:5432/execution_db?connection_limit=5
      REDIS_URL: redis://:seek_redis_pass@redis:6379
      RABBITMQ_URL: amqp://seek_mq_user:seek_rabbitmq_pass@rabbitmq:5672
    networks:
      - shared-net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      rabbitmq:
        condition: service_started

