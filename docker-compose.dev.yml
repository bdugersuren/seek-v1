# Development Overrides and Local Port Mappings
# Host ports are bound strictly to 127.0.0.1 for security.

services:
  # =========================================================================
  # Infrastructure Services Local Port Mappings
  # =========================================================================
  postgres:
    ports:
      - "127.0.0.1:5432:5432"

  redis:
    ports:
      - "127.0.0.1:6379:6379"

  rabbitmq:
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"

  minio:
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"

  # =========================================================================
  # Core Business Services
  # =========================================================================
  auth:
    environment:
      - NODE_ENV=development
      - PORT=3020
    volumes:
      - ./services/auth:/app/services/auth
      - /app/services/auth/node_modules
    ports: !override
      - "127.0.0.1:3020:3020"
    command: pnpm run start:dev

  gateway:
    environment:
      - NODE_ENV=development
      - PORT=3010
    volumes:
      - ./services/gateway:/app/services/gateway
      - /app/services/gateway/node_modules
    ports: !override
      - "127.0.0.1:3010:3010"
    command: pnpm run start:dev

  # =========================================================================
  # Frontend Applications (Mock & Backend-free for assessment-web)
  # =========================================================================
  portal-web:
    environment:
      - NODE_ENV=development
      - INTERNAL_API_URL=http://gateway:3010/api
      - NEXT_PUBLIC_API_URL=http://quiz-api.seek.mn/api
      - NEXT_PUBLIC_ASSESSMENT_WEB_URL=http://localhost:8082
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/portal-web/node_modules
      - /app/apps/portal-web/.next
    ports: !override
      - "127.0.0.1:8081:8081"
    depends_on: !reset []

  assessment-web:
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=http://quiz-api.seek.mn/api
      - NEXT_PUBLIC_EXECUTION_URL=http://quiz-api.seek.mn/api/v1/execution
      - NEXT_PUBLIC_MOCK_MODE=false
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/assessment-web/node_modules
      - /app/apps/assessment-web/.next
    ports: !override
      - "127.0.0.1:8082:8082"
    depends_on: !reset [] # Removes backend execution dependency in dev/mock environment

  # =========================================================================
  # Assessment & Evaluation Services Local Mappings
  # =========================================================================
  profile:
    environment:
      - NODE_ENV=development
      - PORT=3030
    volumes:
      - ./services/profile:/app/services/profile
      - /app/services/profile/node_modules
    ports:
      - "127.0.0.1:3030:3030"
    command: pnpm run start:dev

  organisation:
    environment:
      - NODE_ENV=development
      - PORT=3040
    volumes:
      - ./services/organisation:/app/services/organisation
      - /app/services/organisation/node_modules
    ports:
      - "127.0.0.1:3040:3040"
    command: pnpm run start:dev

  verification:
    environment:
      - NODE_ENV=development
      - PORT=3050
    volumes:
      - ./services/verification:/app/services/verification
      - /app/services/verification/node_modules
    ports:
      - "127.0.0.1:3050:3050"
    command: pnpm run start:dev

  competency:
    environment:
      - NODE_ENV=development
      - PORT=3060
    volumes:
      - ./services/competency:/app/services/competency
      - /app/services/competency/node_modules
    ports:
      - "127.0.0.1:3060:3060"
    command: pnpm run start:dev

  assessment:
    environment:
      - NODE_ENV=development
      - PORT=3070
    volumes:
      - ./services/assessment:/app/services/assessment
      - /app/services/assessment/node_modules
    ports:
      - "127.0.0.1:3070:3070"
    command: pnpm run start:dev

  commerce:
    environment:
      - NODE_ENV=development
      - PORT=3080
    volumes:
      - ./services/commerce:/app/services/commerce
      - /app/services/commerce/node_modules
    ports:
      - "127.0.0.1:3080:3080"
    command: pnpm run start:dev

  execution:
    environment:
      - NODE_ENV=development
      - PORT=3090
      - USE_REDIS=true
      - USE_RABBITMQ=true
      - REDIS_URL=redis://:seek_redis_pass@redis:6379
      - RABBITMQ_URL=amqp://seek_mq_user:seek_rabbitmq_pass@rabbitmq:5672
    volumes:
      - ./services/execution:/app/services/execution
      - /app/services/execution/node_modules
    ports:
      - "127.0.0.1:3090:3090"
    command: pnpm run start:dev

  evaluation-worker:
    environment:
      - NODE_ENV=development
      - PORT=3100
    volumes:
      - ./services/evaluation:/app/services/evaluation
      - /app/services/evaluation/node_modules
    ports:
      - "127.0.0.1:3100:3100"
    command: pnpm run start:dev

  learning:
    environment:
      - NODE_ENV=development
      - PORT=3110
    volumes:
      - ./services/learning:/app/services/learning
      - /app/services/learning/node_modules
    ports:
      - "127.0.0.1:3110:3110"
    command: pnpm run start:dev

  reporting:
    environment:
      - NODE_ENV=development
      - PORT=3150
    volumes:
      - ./services/reporting:/app/services/reporting
      - /app/services/reporting/node_modules
    ports:
      - "127.0.0.1:3150:3150"
    command: pnpm run start:dev

  file:
    environment:
      - NODE_ENV=development
      - PORT=3140
    volumes:
      - ./services/file:/app/services/file
      - /app/services/file/node_modules
    ports:
      - "127.0.0.1:3140:3140"
    command: pnpm run start:dev

  platform:
    environment:
      - NODE_ENV=development
      - PORT=3160
    volumes:
      - ./services/platform:/app/services/platform
      - /app/services/platform/node_modules
    ports:
      - "127.0.0.1:3160:3160"
    command: pnpm run start:dev

  # =========================================================================
  # AI & Integration Services
  # =========================================================================
  ollama:
    ports:
      - "127.0.0.1:11434:11434"

  qdrant:
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"

  ai:
    environment:
      - NODE_ENV=development
      - PORT=3120
    volumes:
      - ./services/ai:/app/services/ai
      - /app/services/ai/node_modules
    ports:
      - "127.0.0.1:3120:3120"
    command: pnpm run start:dev

  integration:
    environment:
      - NODE_ENV=development
      - PORT=3130
    volumes:
      - ./services/integration:/app/services/integration
      - /app/services/integration/node_modules
    ports:
      - "127.0.0.1:3130:3130"
    command: pnpm run start:dev
