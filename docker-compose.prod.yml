  gateway:
    environment:
      NODE_ENV: production
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-seek_jwt_key_safe_entropy_1234567890_super_secure}
      AUTH_COOKIE_SECURE: "true"

  profile:
    environment:
      NODE_ENV: production
      FILE_SERVICE_URL: http://file:3140
      INTEGRATION_SERVICE_URL: http://integration:3130
    volumes: !reset []

  organisation:
    environment:
      NODE_ENV: production

  assessment:
    environment:
      NODE_ENV: production

