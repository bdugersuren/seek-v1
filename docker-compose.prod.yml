# Production-like local overrides.
# This file removes frontend dev bind mounts/watch mode and starts Next.js with
# `next start` from the image built by each frontend Dockerfile.

services:
#  node-modules-init:
#    image: node:18-slim
#    container_name: seed-node_modules
#    working_dir: /app
#    command: sh -c "apt-get update -y && apt-get install -y --no-install-recommends openssl && rm -rf /var/lib/apt/lists/* && npm install -g pnpm && pnpm install --frozen-lockfile --force"
#    volumes:
#      - .:/app
#      - shared_node_modules:/app/node_modules
#      - pnpm_store:/root/.local/share/pnpm/store

  auth:
    environment:
      NODE_ENV: production
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-seek_jwt_key_safe_entropy_1234567890_super_secure}
      AUTH_COOKIE_SECURE: "true"
      AUTH_CSRF_ALLOW_MISSING_ORIGIN: "false"
      AUTH_PUBLIC_APP_URL: ${AUTH_PUBLIC_APP_URL:-https://portal.seek.mn}
      AUTH_EMAIL_FROM: ${AUTH_EMAIL_FROM:-no-reply@seek.mn}
      AUTH_EMAIL_VERIFICATION_TTL_HOURS: ${AUTH_EMAIL_VERIFICATION_TTL_HOURS:-24}
      AUTH_EMAIL_DELIVERY_MODE: smtp
      AUTH_RATE_LIMIT_MAX: ${AUTH_RATE_LIMIT_MAX:-10}
      AUTH_RATE_LIMIT_WINDOW_MS: ${AUTH_RATE_LIMIT_WINDOW_MS:-900000}
      SMTP_HOST: ${SMTP_HOST:?SMTP_HOST is required in production}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      SMTP_USER: ${SMTP_USER:?SMTP_USER is required in production}
      SMTP_PASSWORD: ${SMTP_PASSWORD:?SMTP_PASSWORD is required in production}
      SMTP_HELO_DOMAIN: ${SMTP_HELO_DOMAIN:-seek.mn}
    volumes: !reset []

